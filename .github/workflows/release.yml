name: Release macOS

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Verify tag and tests
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          npm test
      - name: Build and package the unnotarized release
        env:
          PCSS_BUILD_NUMBER: ${{ github.run_number }}
          PCSS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run release:macos
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            outputs/PCSS-*-macOS-universal-unnotarized.zip \
            outputs/PCSS-*-macOS-universal-unnotarized.dmg \
            outputs/SHA256SUMS.txt \
            --verify-tag \
            --notes-file INSTALL.md \
            --title "PCSS ${GITHUB_REF_NAME#v} (unnotarized)"
